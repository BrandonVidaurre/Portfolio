  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"082718fa-6f82-418e-b173-56bf135f93db\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n/* =====================================================\n   DESIGN TOKENS — retro-futurism / Outrun / intergalactic\n   ===================================================== */\n:root {\n  --bg-void:    #06060c;\n  --bg-base:    #0c0c18;\n  --bg-raised:  #14142a;\n  --bg-overlay: #1d1d3a;\n  --fg-1: #f5f3ff;\n  --fg-2: #c8c5e8;\n  --fg-3: #8884b0;\n  --fg-4: #4e4b72;\n  --accent:       #ff2200;\n  --accent-glow:  rgba(255,34,0,0.50);\n  --cyan:         #3d8fff;\n  --cyan-glow:    rgba(61,143,255,0.45);\n  --magenta:      #ff2200;\n  --magenta-glow: rgba(255,34,0,0.50);\n  --amber:        #ffcc00;\n  --amber-glow:   rgba(255,204,0,0.45);\n  --orange:       #ff7700;\n  --orange-glow:  rgba(255,119,0,0.45);\n  --border-soft: rgba(255,255,255,0.07);\n  --border-hard: rgba(255,255,255,0.14);\n  --font-pixel: \"Press Start 2P\", monospace;\n  --font-vt:    \"VT323\", monospace;\n  --font-body:  \"Space Grotesk\", sans-serif;\n  --font-mono:  \"Space Mono\", monospace;\n  --ease-out: cubic-bezier(0.2,0.8,0.2,1);\n}\n\n*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body {\n  background: var(--bg-void);\n  color: var(--fg-1);\n  font-family: var(--font-body);\n  font-size: 16px;\n  line-height: 1.55;\n  overflow-x: hidden;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* =====================================================\n   SCANLINE OVERLAY — site-wide CRT feel\n   ===================================================== */\nbody::after {\n  content:\"\";\n  position:fixed; inset:0; z-index:900; pointer-events:none;\n  background: repeating-linear-gradient(\n    180deg,\n    transparent 0px, transparent 2px,\n    rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 3px\n  );\n  mix-blend-mode: multiply;\n}\n\n/* =====================================================\n   HEADER\n   ===================================================== */\n.bv-header {\n  position: sticky; top:0; z-index:500;\n  display:flex; align-items:center; justify-content:space-between; gap:24px;\n  padding: 14px 32px;\n  background: rgba(6,6,12,0.82);\n  backdrop-filter: blur(18px);\n  border-bottom: 1px solid var(--border-soft);\n}\n.bv-header__brand {\n  font-family: var(--font-pixel); font-size:12px; letter-spacing:0.02em;\n  color: var(--fg-1); text-decoration:none; display:flex; align-items:center; gap:10px;\n}\n.bv-header__brand span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }\n.bv-header__nav { display:flex; gap:28px; }\n.bv-header__nav a {\n  font-family: var(--font-mono); font-size:11px; letter-spacing:0.18em;\n  text-transform:uppercase; color:var(--fg-3); text-decoration:none;\n  transition: color 120ms;\n}\n.bv-header__nav a:hover,.bv-header__nav a.is-active { color:var(--accent); }\n.bv-status {\n  display:flex; align-items:center; gap:8px;\n  font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;\n  color: var(--accent);\n}\n.bv-dot {\n  width:7px; height:7px; border-radius:50%; background:var(--accent);\n  box-shadow:0 0 8px var(--accent-glow);\n  animation: pulse 1.8s ease-in-out infinite;\n}\n@keyframes pulse { 50%{ opacity:0.4; } }\n\n/* =====================================================\n   HERO — deep space with orbs, rainbow beam, grid floor\n   ===================================================== */\n.bv-hero {\n  position:relative; overflow:hidden;\n  min-height: 100vh;\n  display:flex; flex-direction:column; justify-content:center;\n  padding: 140px 48px 80px;\n  isolation: isolate;\n}\n\n/* deep void bg */\n.bv-hero__space {\n  position:absolute; inset:0; z-index:-3;\n  background: radial-gradient(ellipse 80% 60% at 60% 30%, #1a0800 0%, #06060c 60%);\n}\n\n/* stars canvas */\n.bv-hero__stars {\n  position:absolute; inset:0; z-index:-3;\n  background-image:\n    radial-gradient(1.5px 1.5px at 12% 18%, #fff 0, transparent 100%),\n    radial-gradient(1px 1px at 28% 8%, rgba(255,255,255,0.7) 0, transparent 100%),\n    radial-gradient(2px 2px at 52% 22%, #fff 0, transparent 100%),\n    radial-gradient(1px 1px at 71% 6%, rgba(255,255,255,0.6) 0, transparent 100%),\n    radial-gradient(1.5px 1.5px at 88% 15%, #fff 0, transparent 100%),\n    radial-gradient(1px 1px at 5% 45%, rgba(255,255,255,0.5) 0, transparent 100%),\n    radial-gradient(1px 1px at 38% 58%, rgba(255,255,255,0.6) 0, transparent 100%),\n    radial-gradient(1.5px 1.5px at 78% 42%, #fff 0, transparent 100%),\n    radial-gradient(1px 1px at 93% 55%, rgba(255,255,255,0.7) 0, transparent 100%),\n    radial-gradient(2px 2px at 19% 72%, rgba(255,255,255,0.5) 0, transparent 100%),\n    radial-gradient(1px 1px at 64% 78%, rgba(255,255,255,0.6) 0, transparent 100%),\n    radial-gradient(1px 1px at 46% 88%, rgba(255,255,255,0.4) 0, transparent 100%),\n    radial-gradient(1.5px 1.5px at 82% 82%, rgba(255,255,255,0.7) 0, transparent 100%),\n    radial-gradient(1px 1px at 33% 94%, rgba(255,255,255,0.5) 0, transparent 100%);\n}\n\n/* cross-star sparkles (like the reference images) */\n.bv-hero__stars::after {\n  content:\"✦ ✦ ✦ ✦ ✦\";\n  position:absolute; inset:0; z-index:1; pointer-events:none;\n  font-size:24px; line-height:1;\n  color: rgba(255,255,255,0.6);\n  letter-spacing:0;\n  white-space:pre;\n  /* sprinkle them around */\n  display:flex;\n  align-items:flex-start;\n  padding: 14% 8% 0 72%;\n  gap:120px;\n  flex-wrap:wrap;\n  animation: twinkle 4s ease-in-out infinite;\n}\n@keyframes twinkle { 0%,100%{opacity:0.5} 50%{opacity:1} }\n\n/* RAINBOW CHROMATIC BEAM — key element from all the references */\n.bv-hero__beam {\n  position:absolute; z-index:-1;\n  top:0; right:18%; width:260px; height:100%;\n  background: linear-gradient(180deg,\n    rgba(61,143,255,0.0) 0%,\n    rgba(61,143,255,0.55) 8%,\n    rgba(61,143,255,0.4) 20%,\n    rgba(255,204,0,0.5) 36%,\n    rgba(255,119,0,0.55) 52%,\n    rgba(255,34,0,0.6) 68%,\n    rgba(180,0,0,0.35) 85%,\n    rgba(0,0,0,0) 100%\n  );\n  filter: blur(28px);\n  transform: skewX(-4deg);\n  animation: beamShimmer 8s ease-in-out infinite;\n}\n@keyframes beamShimmer {\n  0%,100%{ opacity:0.7; transform:skewX(-4deg) scaleX(1); }\n  50%{ opacity:1; transform:skewX(-2deg) scaleX(1.12); }\n}\n\n/* secondary narrower beam */\n.bv-hero__beam2 {\n  position:absolute; z-index:-1;\n  top:0; right:22%; width:80px; height:100%;\n  background: linear-gradient(180deg,\n    transparent 0%, rgba(255,255,255,0.7) 10%,\n    rgba(255,255,255,0.4) 40%, transparent 100%\n  );\n  filter: blur(8px);\n  animation: beam2 8s ease-in-out infinite 1s;\n}\n@keyframes beam2 { 0%,100%{opacity:0.6} 50%{opacity:1} }\n\n/* FLOATING ORBS — direct from the VHS / poster references */\n.bv-orb {\n  position:absolute; border-radius:50%; z-index:-1;\n  pointer-events:none;\n}\n.bv-orb--1 {\n  width:380px; height:380px;\n  right:-60px; top:4%;\n  background: radial-gradient(circle at 36% 36%, rgba(255,255,255,0.9) 0%, rgba(255,220,180,0.65) 22%, rgba(255,119,0,0.55) 50%, rgba(180,20,0,0.3) 78%, transparent 100%);\n  filter: blur(2px);\n  animation: floatOrb1 12s ease-in-out infinite;\n}\n.bv-orb--2 {\n  width:120px; height:120px;\n  right:28%; top:12%;\n  background: radial-gradient(circle at 40% 38%, rgba(255,255,255,0.88) 0%, rgba(255,230,120,0.65) 28%, rgba(255,204,0,0.45) 58%, transparent 100%);\n  filter: blur(1px);\n  animation: floatOrb2 9s ease-in-out infinite 2s;\n}\n.bv-orb--3 {\n  width:55px; height:55px;\n  right:38%; top:8%;\n  background: radial-gradient(circle at 40% 38%, rgba(255,255,255,0.9) 0%, rgba(160,200,255,0.7) 40%, rgba(61,143,255,0.5) 70%, transparent 100%);\n  animation: floatOrb3 7s ease-in-out infinite 1s;\n}\n@keyframes floatOrb1 { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-18px) scale(1.03)} }\n@keyframes floatOrb2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px) translateX(6px)} }\n@keyframes floatOrb3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px) translateX(-4px)} }\n\n/* PERSPECTIVE GRID FLOOR — the hallmark of all the references */\n.bv-hero__grid {\n  position:absolute; bottom:0; left:0; right:0; height:52%;\n  z-index:-2;\n  perspective: 600px; perspective-origin: 50% 0%;\n  overflow:hidden;\n}\n.bv-hero__grid-inner {\n  position:absolute; inset:0;\n  transform: rotateX(68deg) translateY(-12%);\n  transform-origin: 50% 0%;\n}\n.bv-hero__grid-inner::before {\n  content:\"\";\n  position:absolute; inset:0;\n  background-image:\n    linear-gradient(to right, rgba(255,34,0,0.35) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(255,34,0,0.35) 1px, transparent 1px);\n  background-size: 80px 80px;\n}\n.bv-hero__grid-inner::after {\n  content:\"\";\n  position:absolute; inset:0;\n  background: linear-gradient(to bottom, rgba(6,6,12,0) 0%, rgba(6,6,12,0.9) 88%, var(--bg-void) 100%);\n}\n/* grid glow lines */\n.bv-hero__grid-glow {\n  position:absolute; bottom:0; left:0; right:0; height:60%;\n  background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(255,34,0,0.22) 0%, transparent 70%);\n  z-index:-1;\n}\n\n/* VHS grain overlay */\n.bv-hero__grain {\n  position:absolute; inset:0; z-index:-1; pointer-events:none;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E\");\n  background-size: 256px 256px;\n  opacity:0.6;\n  mix-blend-mode: screen;\n}\n\n/* CRT vignette */\n.bv-hero::before {\n  content:\"\";\n  position:absolute; inset:0; z-index:-1; pointer-events:none;\n  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);\n}\n\n/* HERO CONTENT */\n.bv-hero__content {\n  position:relative; z-index:2;\n  max-width: 700px;\n  display:flex; flex-direction:column; gap:20px;\n}\n\n.bv-eyebrow {\n  font-family:var(--font-mono); font-size:11px; letter-spacing:0.22em;\n  text-transform:uppercase; color:var(--accent);\n  display:flex; align-items:center; gap:8px;\n}\n.bv-eyebrow::before { content:\"//\"; color:var(--cyan); }\n\n.bv-hero__name {\n  font-family: var(--font-pixel);\n  font-size: clamp(32px, 7vw, 80px);\n  line-height:1.1; letter-spacing:0;\n  display:flex; flex-direction:column; gap:6px;\n  /* CHROMATIC ABERRATION name effect — key retro look */\n  position:relative;\n}\n.bv-hero__name span { display:block; }\n.bv-hero__name .name-a {\n  color: transparent;\n  background: linear-gradient(175deg, #ffffff 0%, #ffe8c8 24%, #ff7700 48%, #cc2200 60%, #3a0800 96%);\n  -webkit-background-clip: text; background-clip: text;\n  filter: drop-shadow(3px 2px 0 rgba(255,204,0,0.9)) drop-shadow(-2px -1px 0 rgba(61,143,255,0.6));\n}\n.bv-hero__name .name-b {\n  color: transparent;\n  background: linear-gradient(175deg, #ffffff 0%, #ffd080 22%, #ffcc00 46%, #cc8800 60%, #1a0e00 96%);\n  -webkit-background-clip: text; background-clip: text;\n  filter: drop-shadow(3px 2px 0 rgba(255,34,0,0.8)) drop-shadow(-1px 0 0 rgba(61,143,255,0.5));\n}\n\n.bv-hero__tagline {\n  font-family: var(--font-body); font-size:18px;\n  color:var(--fg-2); max-width:540px; line-height:1.6;\n}\n.bv-hero__tagline em { font-style:normal; color:var(--accent); font-weight:600; }\n\n.bv-hero__ctas { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; }\n\n/* BUTTONS */\n.bv-btn {\n  font-family:var(--font-pixel); font-size:11px; letter-spacing:0.04em;\n  padding:13px 20px; border:2px solid; cursor:pointer; position:relative;\n  display:inline-flex; align-items:center; gap:6px;\n  transition: transform 80ms steps(2), box-shadow 80ms steps(2);\n  text-decoration:none;\n}\n.bv-btn--primary {\n  background:var(--accent); color:#040f08; border-color:var(--accent);\n  box-shadow: 4px 4px 0 var(--cyan), 0 0 20px var(--accent-glow);\n}\n.bv-btn--primary:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--cyan), 0 0 32px var(--accent-glow); }\n.bv-btn--primary:active { transform:translate(3px,3px); box-shadow:0 0 0 transparent; }\n.bv-btn--outline {\n  background:transparent; color:var(--cyan); border-color:var(--cyan);\n  box-shadow: 4px 4px 0 var(--magenta);\n}\n.bv-btn--outline:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--magenta), 0 0 20px var(--cyan-glow); }\n.bv-btn--outline:active { transform:translate(3px,3px); box-shadow:0 0 0 transparent; }\n\n/* stats row */\n.bv-hero__stats {\n  display:flex; gap:40px; margin-top:24px;\n  padding-top:24px; border-top:1px solid var(--border-soft);\n}\n.bv-stat__n {\n  font-family:var(--font-pixel); font-size:32px; color:var(--fg-1);\n  text-shadow: 3px 3px 0 var(--orange), 0 0 20px var(--cyan-glow);\n}\n.bv-stat__l {\n  font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em;\n  text-transform:uppercase; color:var(--fg-3); margin-top:6px;\n}\n\n/* MARQUEE */\n.bv-marquee {\n  position:absolute; bottom:0; left:0; right:0;\n  background:var(--accent); color:#fff;\n  font-family:var(--font-pixel); font-size:12px;\n  padding:12px 0; overflow:hidden;\n  transform: rotate(-1deg); margin:0 -40px;\n  box-shadow:0 0 40px var(--accent-glow), 0 0 80px var(--accent-glow);\n  border-top:2px solid rgba(255,255,255,0.6);\n  border-bottom:2px solid rgba(255,255,255,0.6);\n}\n.bv-marquee__track {\n  display:flex; white-space:nowrap;\n  animation: scroll 36s linear infinite;\n  width:max-content;\n}\n.bv-marquee__track span { padding-right:28px; }\n@keyframes scroll { to{ transform:translateX(-50%); } }\n\n/* =====================================================\n   SECTIONS\n   ===================================================== */\n.bv-section {\n  padding: 96px 48px;\n  max-width: 1280px; margin:0 auto;\n}\n.bv-section--full { max-width:none; padding:96px 48px; }\n\n.bv-section__head { margin-bottom:48px; display:flex; flex-direction:column; gap:12px; }\n\n.bv-section__title {\n  font-family:var(--font-pixel);\n  font-size: clamp(20px, 3vw, 36px);\n  text-transform:uppercase; margin:0;\n  color:var(--fg-1);\n  text-shadow: 3px 3px 0 var(--orange);\n}\n.bv-section__sub { font-size:16px; color:var(--fg-3); max-width:560px; }\n\n/* PROJECT GRID */\n.bv-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }\n.bv-card {\n  position:relative; background:var(--bg-base); border:2px solid var(--border-hard);\n  padding:24px; display:flex; flex-direction:column; gap:12px; min-height:200px;\n  transition: transform 100ms steps(2);\n  /* grid inner glow */\n  background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,119,0,0.06) 0%, transparent 70%);\n}\n/* L-bracket corners — from the design system */\n.bv-card::before {\n  content:\"\"; position:absolute; top:0; right:0;\n  width:28px; height:28px;\n  border-top:2px solid var(--accent); border-right:2px solid var(--accent);\n  box-shadow:0 0 10px var(--accent-glow);\n}\n.bv-card::after {\n  content:\"\"; position:absolute; bottom:0; left:0;\n  width:28px; height:28px;\n  border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan);\n  box-shadow:0 0 10px var(--cyan-glow);\n}\n.bv-card:hover { transform:translate(-2px,-2px); border-color:var(--border-hard); }\n.bv-card--feat {\n  border-color:var(--accent);\n  box-shadow:0 0 0 1px var(--accent), 0 0 40px var(--accent-glow);\n}\n.bv-card__featured {\n  position:absolute; top:-12px; right:16px;\n  background:var(--accent); color:#fff;\n  font-family:var(--font-pixel); font-size:9px; padding:5px 10px;\n  box-shadow: 3px 3px 0 var(--amber), 0 0 16px var(--accent-glow);\n}\n.bv-card__title {\n  font-family:var(--font-pixel); font-size:16px; margin:0;\n  color:var(--fg-1); text-transform:lowercase;\n}\n.bv-card__desc { font-size:14px; color:var(--fg-2); margin:0; flex:1; line-height:1.6; }\n.bv-card__foot { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:auto; }\n.bv-card__tags { display:flex; gap:6px; flex-wrap:wrap; }\n.bv-tag {\n  font-family:var(--font-mono); font-size:10px; color:var(--fg-3);\n  padding:3px 8px; border:1px solid var(--border-soft); border-radius:999px;\n}\n.bv-badge {\n  font-family:var(--font-pixel); font-size:8px; letter-spacing:0.04em; padding:5px 8px;\n}\n.bv-badge--phos { background:var(--accent); color:#fff; }\n.bv-badge--amber { background:var(--amber); color:#1a0e00; }\n\n/* =====================================================\n   VLOG — CRT TV teaser\n   ===================================================== */\n.bv-vlog { display:grid; grid-template-columns:1.2fr 1fr; gap:48px; align-items:center; }\n.bv-tv {\n  background:linear-gradient(180deg,#b8bcc5 0%,#60666e 60%,#232830 100%);\n  border-radius:14px; padding:16px; position:relative;\n  box-shadow:0 24px 48px rgba(0,0,0,0.7),inset 0 0 0 2px #fff,inset 0 0 0 4px #222630;\n}\n.bv-tv__screen {\n  background:#06060c; aspect-ratio:4/3; border-radius:20px 20px/14px 14px;\n  position:relative; overflow:hidden;\n  box-shadow:inset 0 0 0 2px #1a1a28, inset 0 0 60px rgba(0,0,0,0.7);\n}\n.bv-tv__play {\n  position:absolute; inset:0;\n  background:radial-gradient(ellipse at center, #0d0a30 0%, #06060c 70%);\n  border:0; cursor:pointer; display:flex; align-items:center; justify-content:center;\n}\n.bv-tv__play-triangle {\n  width:0; height:0; border-style:solid;\n  border-width:28px 0 28px 46px;\n  border-color:transparent transparent transparent var(--accent);\n  filter:drop-shadow(0 0 14px var(--accent-glow));\n  transition:transform 100ms steps(2);\n}\n.bv-tv__play:hover .bv-tv__play-triangle { transform:scale(1.15); }\n.bv-tv__playing {\n  position:absolute; inset:0;\n  background:radial-gradient(ellipse at center, #1a0a3a 0%, #06060c 80%);\n  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;\n}\n.bv-tv__bars { display:flex; gap:4px; align-items:flex-end; height:52px; }\n.bv-tv__bars span {\n  width:7px; background:var(--accent);\n  box-shadow:0 0 8px var(--accent-glow);\n  animation:bars 0.9s ease-in-out infinite alternate;\n}\n@keyframes bars { from{height:6px} to{height:52px} }\n.bv-tv__caption { font-family:var(--font-pixel); font-size:10px; color:var(--orange); text-shadow:0 0 8px var(--orange-glow); }\n.bv-tv__scan {\n  position:absolute; inset:0; pointer-events:none;\n  background:repeating-linear-gradient(180deg,transparent 0px,transparent 2px,rgba(0,0,0,0.25) 2px,rgba(0,0,0,0.25) 3px);\n  opacity:0.7; mix-blend-mode:multiply;\n}\n.bv-tv__crt {\n  position:absolute; inset:0; pointer-events:none;\n  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.65) 100%);\n}\n.bv-tv__onair {\n  position:absolute; top:12px; right:12px;\n  font-family:var(--font-pixel); font-size:8px; color:var(--magenta);\n  text-shadow:0 0 8px var(--magenta-glow);\n  animation:pulse 1.4s steps(2) infinite;\n}\n.bv-tv__bezel { display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding:4px 8px; }\n.bv-tv__knob {\n  width:20px; height:20px; border-radius:50%;\n  background:radial-gradient(circle at 30% 30%,#eef0f2,#4a5260 60%,#1a1f26);\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.5);\n}\n.bv-tv__label { font-family:var(--font-pixel); font-size:8px; color:#1a1f26; }\n\n.bv-vlog__num { font-family:var(--font-pixel); font-size:13px; color:var(--accent); text-shadow:0 0 10px var(--accent-glow); margin-bottom:10px; }\n.bv-vlog__title { font-family:var(--font-pixel); font-size:18px; line-height:1.5; text-transform:lowercase; margin:0 0 14px; }\n.bv-vlog__desc { color:var(--fg-2); margin:0 0 20px; line-height:1.6; }\n.bv-vlog__chips { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }\n\n/* =====================================================\n   ABOUT\n   ===================================================== */\n.bv-section--about {\n  background: linear-gradient(180deg, transparent, rgba(255,34,0,0.03) 50%, transparent);\n  border-top:1px solid var(--border-soft);\n  border-bottom:1px solid var(--border-soft);\n}\n.bv-about { display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:start; }\n.bv-about__col p { color:var(--fg-2); line-height:1.65; margin:14px 0 0; max-width:none; }\n.bv-about__term {\n  background:var(--bg-base); border:2px solid var(--accent);\n  box-shadow:0 0 30px var(--accent-glow), inset 0 0 20px rgba(255,34,0,0.04);\n}\n.bv-term__head {\n  background:var(--bg-overlay); padding:10px 14px;\n  display:flex; align-items:center; gap:8px;\n  border-bottom:1px solid var(--border-soft);\n}\n.bv-term__dot { width:11px; height:11px; border-radius:50%; }\n.bv-term__title { margin-left:6px; font-size:11px; color:var(--fg-3); font-family:var(--font-mono); letter-spacing:0.06em; }\n.bv-term__body {\n  padding:18px; color:var(--accent);\n  font-family:var(--font-mono); font-size:14px; line-height:2; position:relative;\n}\n.bv-term__body .d { color:var(--fg-4); margin-right:6px; }\n.bv-term__body .p { color:var(--orange); margin-right:6px; }\n.bv-term__body .ok { color:var(--accent); }\n.bv-term__body .cur { background:var(--accent); color:#040f08; padding:0 4px; animation:blink 1s steps(2) infinite; }\n@keyframes blink { 50%{opacity:0} }\n\n/* =====================================================\n   CONTACT\n   ===================================================== */\n.bv-section--contact {\n  text-align:center;\n  border-top:1px solid var(--border-soft);\n  background:linear-gradient(135deg,rgba(255,34,0,0.06) 0%,rgba(255,204,0,0.05) 50%,rgba(61,143,255,0.06) 100%);\n}\n.bv-contact { max-width:680px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:16px; }\n.bv-contact__sub { color:var(--fg-3); }\n.bv-contact__form { display:flex; gap:12px; width:100%; max-width:520px; margin-top:16px; }\n.bv-input {\n  flex:1; font-family:var(--font-mono); font-size:14px;\n  padding:13px 16px; background:var(--bg-base);\n  border:2px solid var(--fg-1); color:var(--fg-1); outline:none;\n}\n.bv-input:focus { border-color:var(--accent); box-shadow:4px 4px 0 var(--cyan); }\n.bv-contact__sent {\n  font-family:var(--font-mono); font-size:14px; color:var(--accent);\n  display:flex; align-items:center; gap:12px; margin-top:16px;\n  padding:14px 20px; border:1px dashed var(--accent);\n}\n\n/* =====================================================\n   FOOTER\n   ===================================================== */\n.bv-footer {\n  border-top:1px solid var(--border-soft);\n  padding:28px 48px;\n}\n.bv-footer__row { max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; }\n.bv-footer__brand { display:flex; align-items:center; gap:12px; font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; color:var(--fg-3); }\n.bv-footer__links { display:flex; gap:20px; }\n.bv-footer__links a { font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fg-3); text-decoration:none; transition:color 120ms; }\n.bv-footer__links a:hover { color:var(--accent); }\n.bv-footer__sig { font-family:var(--font-mono); font-size:10px; color:var(--fg-4); letter-spacing:0.06em; }\n\n/* =====================================================\n   DIVIDER — magenta horizontal rule with glow\n   ===================================================== */\n.bv-divider {\n  width:100%; height:1px;\n  background:linear-gradient(90deg,transparent 0%,var(--accent) 20%,var(--orange) 40%,var(--amber) 60%,var(--cyan) 80%,transparent 100%);\n  box-shadow:0 0 14px var(--accent-glow);\n}\n\n/* =====================================================\n   HERO PHOTO\n   ===================================================== */\n.bv-hero__layout {\n  display: flex;\n  align-items: flex-end;\n  gap: 56px;\n  width: 100%;\n  max-width: 1300px;\n}\n.bv-hero__content {\n  max-width: none;\n  flex: 1;\n}\n.bv-hero__photo-wrap {\n  flex: 0 0 450px;\n  position: relative;\n  z-index: 2;\n  /* subtle bob — feels like a ship gently drifting */\n  animation: photoBob 9s ease-in-out infinite;\n  will-change: transform;\n}\n@keyframes photoBob {\n  0%, 100% { transform: translateY(0); }\n  50%      { transform: translateY(-6px); }\n}\n.bv-hero__photo {\n  width: 100%;\n  display: block;\n  filter: sepia(0.15) saturate(1.2) contrast(1.1) brightness(0.88);\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n}\n\n/* COCKPIT WINDOW — animated star drift visible only inside the porthole */\n.bv-hero__photo-window {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  /* clip to the porthole region only (avoid overlapping Brandon's silhouette) */\n  clip-path: polygon(3.5% 32%, 30% 30%, 31% 51%, 26% 55.5%, 3.5% 56%);\n  mix-blend-mode: screen;\n  overflow: hidden;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n}\n.bv-hero__photo-window-stars {\n  position: absolute;\n  top: 30%;\n  left: 3.5%;\n  width: 90%;\n  height: 28%;\n  background-image:\n    radial-gradient(1.6px 1.6px at  4% 28%, #ffe2b8, transparent 60%),\n    radial-gradient(1px   1px   at  9% 62%, #ffaa70, transparent 60%),\n    radial-gradient(2px   2px   at 14% 18%, #ffd9a0, transparent 60%),\n    radial-gradient(1px   1px   at 19% 72%, #ff9050, transparent 60%),\n    radial-gradient(1.5px 1.5px at 24% 45%, #ffcc88, transparent 60%),\n    radial-gradient(1px   1px   at 30% 24%, #ffb080, transparent 60%),\n    radial-gradient(2.2px 2.2px at 35% 66%, #ffe0a8, transparent 60%),\n    radial-gradient(1px   1px   at 41% 14%, #ffaa70, transparent 60%),\n    radial-gradient(1.5px 1.5px at 47% 52%, #ffd098, transparent 60%),\n    radial-gradient(1px   1px   at 52% 78%, #ffb070, transparent 60%),\n    radial-gradient(1.2px 1.2px at 58% 32%, #ffd0a0, transparent 60%),\n    radial-gradient(1.6px 1.6px at 64% 64%, #ffe2b8, transparent 60%),\n    radial-gradient(1px   1px   at 70% 18%, #ffaa70, transparent 60%),\n    radial-gradient(1.4px 1.4px at 76% 48%, #ffd098, transparent 60%),\n    radial-gradient(1px   1px   at 82% 70%, #ffb070, transparent 60%),\n    radial-gradient(2px   2px   at 88% 30%, #ffe0a8, transparent 60%);\n  animation: windowStarPan 16s linear infinite;\n  will-change: transform;\n}\n/* a brighter \"warp\" core inside the window that flickers — distant sun */\n.bv-hero__photo-window::after {\n  content:\"\";\n  position:absolute;\n  top:42%; left:8%;\n  width:38px; height:38px; border-radius:50%;\n  background: radial-gradient(circle, #ffd9a8 0%, rgba(255,140,40,0.6) 35%, transparent 70%);\n  filter: blur(3px);\n  animation: warpStarFlicker 4.6s ease-in-out infinite;\n}\n@keyframes windowStarPan {\n  from { transform: translateX(0); }\n  to   { transform: translateX(-44%); }\n}\n@keyframes warpStarFlicker {\n  0%,100% { opacity: 0.55; transform: scale(1); }\n  47%     { opacity: 0.95; transform: scale(1.08); }\n  53%     { opacity: 0.70; }\n}\n\n/* CHROME SHEEN — a slow diagonal highlight sliding across the suit */\n.bv-hero__photo-sheen {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  background: linear-gradient(\n    112deg,\n    transparent 38%,\n    rgba(255, 220, 170, 0.00) 46%,\n    rgba(255, 230, 190, 0.20) 50%,\n    rgba(255, 220, 170, 0.00) 54%,\n    transparent 62%\n  );\n  background-size: 260% 100%;\n  mix-blend-mode: screen;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  animation: sheenPan 11s ease-in-out infinite;\n  opacity: 0.85;\n}\n@keyframes sheenPan {\n  0%   { background-position: 200% 0; }\n  100% { background-position: -100% 0; }\n}\n\n/* HAIR — duplicate image, masked to just the crown of the head, subtly turbulence-displaced */\n.bv-hero__photo-hair {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  width: 100%;\n  display: block;\n  filter: sepia(0.15) saturate(1.2) contrast(1.1) brightness(0.88) url(#hairWind);\n  /* tight mask over the top crown only; nowhere near the face */\n  -webkit-mask-image: radial-gradient(ellipse 14% 9% at 56% 24%, #000 25%, transparent 88%);\n  mask-image:         radial-gradient(ellipse 14% 9% at 56% 24%, #000 25%, transparent 88%);\n}\n\n/* SHADOW RAKE — a dark band sweeping across, like a passing object in space */\n.bv-hero__photo-shadow {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  background: linear-gradient(\n    96deg,\n    transparent 28%,\n    rgba(0, 0, 0, 0.00) 42%,\n    rgba(0, 0, 0, 0.30) 50%,\n    rgba(0, 0, 0, 0.00) 58%,\n    transparent 72%\n  );\n  background-size: 240% 100%;\n  mix-blend-mode: multiply;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  animation: sheenPan 9s linear infinite;\n  opacity: 0.7;\n}\n\n/* STARLIGHT RAKE — a cool reflection band sweeping the other way */\n.bv-hero__photo-starlight {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  background: linear-gradient(\n    100deg,\n    transparent 34%,\n    rgba(160, 210, 255, 0.00) 44%,\n    rgba(200, 230, 255, 0.22) 50%,\n    rgba(160, 210, 255, 0.00) 56%,\n    transparent 66%\n  );\n  background-size: 260% 100%;\n  mix-blend-mode: screen;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  animation: sheenPan 13s linear infinite -3s;\n  opacity: 0.8;\n}\n\n/* COCKPIT-LIGHT FLICKER — slight warm pulse over the top of the image */\n.bv-hero__photo-flicker {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  background:\n    radial-gradient(ellipse 60% 18% at 50% 4%,  rgba(255,160,60,0.18), transparent 70%),\n    radial-gradient(ellipse 40% 12% at 18% 8%,  rgba(255,80,30,0.16),  transparent 70%);\n  mix-blend-mode: screen;\n  animation: cockpitFlicker 3.7s steps(8, end) infinite;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n}\n@keyframes cockpitFlicker {\n  0%,100% { opacity: 0.85; }\n  37%     { opacity: 0.55; }\n  39%     { opacity: 1; }\n  62%     { opacity: 0.7; }\n  64%     { opacity: 1; }\n}\n.bv-hero__photo-wrap::before {\n  content: \"\";\n  position: absolute;\n  top: -6px; right: -6px;\n  width: 44px; height: 44px;\n  border-top: 3px solid var(--accent);\n  border-right: 3px solid var(--accent);\n  box-shadow: 0 0 20px var(--accent-glow);\n  z-index: 3;\n}\n.bv-hero__photo-scan {\n  position: absolute;\n  inset: 0;\n  background: repeating-linear-gradient(\n    180deg,\n    transparent 0px, transparent 2px,\n    rgba(0,0,0,0.14) 2px, rgba(0,0,0,0.14) 3px\n  );\n  pointer-events: none;\n  z-index: 3;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  /* subtle scanline roll */\n  animation: scanlineRoll 4s linear infinite;\n}\n@keyframes scanlineRoll {\n  from { background-position: 0 0; }\n  to   { background-position: 0 6px; }\n}\n.bv-hero__photo-glow {\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(255,34,0,0.18) 100%),\n    linear-gradient(to top, rgba(255,34,0,0.25) 0%, transparent 28%);\n  pointer-events: none;\n  z-index: 3;\n  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n  mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);\n}\n.bv-hero__photo-label {\n  position: absolute;\n  bottom: 0; left: 0; right: 0;\n  background: linear-gradient(90deg, var(--accent) 0%, var(--orange) 100%);\n  color: #fff;\n  font-family: var(--font-pixel);\n  font-size: 8px;\n  letter-spacing: 0.1em;\n  padding: 7px 12px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  z-index: 4;\n  box-shadow: 0 0 24px var(--accent-glow);\n}\n/* cyan bottom-left bracket on photo */\n.bv-hero__photo-bracket {\n  position: absolute;\n  bottom: -6px; left: -6px;\n  width: 44px; height: 44px;\n  border-bottom: 3px solid var(--cyan);\n  border-left: 3px solid var(--cyan);\n  box-shadow: 0 0 20px var(--cyan-glow);\n  z-index: 4;\n}\n/* tiny REC indicator in the corner of the photo — sells the \"live feed\" idea */\n.bv-hero__photo-rec {\n  position: absolute;\n  top: 10px; left: 10px;\n  z-index: 4;\n  font-family: var(--font-pixel);\n  font-size: 8px;\n  letter-spacing: 0.12em;\n  color: #fff;\n  background: rgba(6,6,12,0.55);\n  padding: 5px 8px 5px 18px;\n  border: 1px solid rgba(255,34,0,0.6);\n  text-shadow: 0 0 6px var(--accent-glow);\n}\n.bv-hero__photo-rec::before {\n  content: \"\";\n  position: absolute;\n  top: 50%; left: 7px;\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 8px var(--accent-glow);\n  transform: translateY(-50%);\n  animation: pulse 1.4s ease-in-out infinite;\n}\n\n/* =====================================================\n   STAR DRIFT ANIMATION\n   ===================================================== */\n@keyframes starDrift {\n  0%   { transform: translate(0px,   0px); }\n  20%  { transform: translate(-10px, -16px); }\n  45%  { transform: translate(-5px,  -28px); }\n  70%  { transform: translate(9px,   -18px); }\n  100% { transform: translate(0px,   0px); }\n}\n.bv-hero__stars {\n  animation: starDrift 100s ease-in-out infinite;\n}\n\n/* =====================================================\n   RESPONSIVE\n   ===================================================== */\n@media(max-width:900px){\n  .bv-header { padding:12px 20px; }\n  .bv-header__nav { display:none; }\n  .bv-hero { padding:120px 24px 60px; min-height:auto; }\n  .bv-section,.bv-section--full { padding:72px 24px; }\n  .bv-grid { grid-template-columns:1fr; }\n  .bv-vlog { grid-template-columns:1fr; }\n  .bv-about { grid-template-columns:1fr; gap:32px; }\n  .bv-hero__stats { gap:20px; flex-wrap:wrap; }\n  .bv-footer { padding:24px 24px; }\n  .bv-orb--1 { width:240px; height:240px; right:-40px; }\n  .bv-hero__layout { flex-direction: column-reverse; align-items: center; gap: 32px; }\n  .bv-hero__photo-wrap { flex: none; width: 200px; }\n}\n\n/* =====================================================\n   ENTRY ANIMATIONS\n   ===================================================== */\n@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }\n.anim-1 { animation:fadeUp 700ms var(--ease-out) 100ms both; }\n.anim-2 { animation:fadeUp 700ms var(--ease-out) 250ms both; }\n.anim-3 { animation:fadeUp 700ms var(--ease-out) 400ms both; }\n.anim-4 { animation:fadeUp 700ms var(--ease-out) 550ms both; }\n.anim-5 { animation:fadeUp 700ms var(--ease-out) 700ms both; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"bv-header\">\n  <a href=\"#\" class=\"bv-header__brand\">BV<span>//<\u002Fspan>BRANDON V.<\u002Fa>\n  <nav class=\"bv-header__nav\">\n    <a href=\"#projects\" class=\"is-active\">PROJECTS<\u002Fa>\n    <a href=\"#news\">NEWS<\u002Fa>\n    <a href=\"#about\">ABOUT<\u002Fa>\n    <a href=\"#contact\">CONTACT<\u002Fa>\n  <\u002Fnav>\n  <div class=\"bv-status\">\n    <span class=\"bv-dot\"><\u002Fspan>\n    ONLINE.\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section class=\"bv-hero\">\n  <!-- background layers -->\n  <div class=\"bv-hero__space\"><\u002Fdiv>\n  <div class=\"bv-hero__stars\"><\u002Fdiv>\n  <div class=\"bv-hero__grain\"><\u002Fdiv>\n\n  <!-- rainbow chromatic beam -->\n  <div class=\"bv-hero__beam\"><\u002Fdiv>\n  <div class=\"bv-hero__beam2\"><\u002Fdiv>\n\n  <!-- floating orbs -->\n  <div class=\"bv-orb bv-orb--1\"><\u002Fdiv>\n  <div class=\"bv-orb bv-orb--2\"><\u002Fdiv>\n  <div class=\"bv-orb bv-orb--3\"><\u002Fdiv>\n\n  <!-- perspective grid floor -->\n  <div class=\"bv-hero__grid\">\n    <div class=\"bv-hero__grid-inner\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bv-hero__grid-glow\"><\u002Fdiv>\n\n  <!-- content -->\n  <div class=\"bv-hero__layout\">\n    <div class=\"bv-hero__content\">\n      <div class=\"bv-eyebrow anim-1\">TRANSMISSION_INCOMING · SECTOR 2087<\u002Fdiv>\n      <h1 class=\"bv-hero__name anim-2\">\n        <span class=\"name-a\">BRANDON<\u002Fspan>\n        <span class=\"name-b\">VIDAURRE<\u002Fspan>\n      <\u002Fh1>\n      <p class=\"bv-hero__tagline anim-3\">\n        building tools at the intersection of <em>timeless<\u002Fem> and <em>useful<\u002Fem>.<br>\n        based in the present, designing for the years to come.\n      <\u002Fp>\n      <div class=\"bv-hero__ctas anim-4\">\n        <a href=\"#projects\" class=\"bv-btn bv-btn--primary\">SEE THE WORK &nbsp;→<\u002Fa>\n        <a href=\"#contact\" class=\"bv-btn bv-btn--outline\">MESSAGE<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"bv-hero__stats anim-5\">\n        <div class=\"bv-stat\"><div class=\"bv-stat__n\">3<\u002Fdiv><div class=\"bv-stat__l\">PROJECTS SHIPPED<\u002Fdiv><\u002Fdiv>\n        <div class=\"bv-stat\"><div class=\"bv-stat__n\">0<\u002Fdiv><div class=\"bv-stat__l\">VLOG \n<!-- VLOG -->\n<section class=\"bv-section\" id=\"vlog\">\n  <div class=\"bv-section__head\">\n    <div class=\"bv-eyebrow\">VLOG · EP_003<\u002Fdiv>\n    <h2 class=\"bv-section__title\">things i made on camera<\u002Fh2>\n    <p class=\"bv-section__sub\">i film myself building here. it's mostly going to be raspberry pi projects. people seem to like it.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"bv-vlog\">\n    <div class=\"bv-tv\">\n      <div class=\"bv-tv__screen\" id=\"tv-screen\">\n        <button class=\"bv-tv__play\" onclick=\"startPlaying()\" aria-label=\"Play\">\n          <span class=\"bv-tv__play-triangle\"><\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"bv-tv__scan\"><\u002Fdiv>\n        <div class=\"bv-tv__crt\"><\u002Fdiv>\n        <div class=\"bv-tv__onair\">● ON AIR<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"bv-tv__bezel\">\n        <div class=\"bv-tv__knob\"><\u002Fdiv>\n        <div class=\"bv-tv__label\">VECTOR CRT // EP-042<\u002Fdiv>\n        <div class=\"bv-tv__knob\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"bv-vlog__meta\">\n      <div class=\"bv-vlog__num\">EP_042<\u002Fdiv>\n      <h3 class=\"bv-vlog__title\">Coming Soon...<\u002Fh3>\n      <p class=\"bv-vlog__desc\">family gen ai rover robot in works<\u002Fp>\n      <div class=\"bv-vlog__chips\">\n        <span class=\"bv-tag\">22:14<\u002Fspan>\n        <span class=\"bv-tag\">audio<\u002Fspan>\n        <span class=\"bv-tag\">react<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"#\" class=\"bv-btn bv-btn--primary\">▶ WATCH NOW<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"bv-divider\"><\u002Fdiv>\n\n<!-- ABOUT -->\n<section class=\"bv-section bv-section--about\" id=\"about\">\n  <div class=\"bv-about\">\n    <div class=\"bv-about__col\">\n      <div class=\"bv-eyebrow\">ABOUT · EP_004<\u002Fdiv>\n      <h2 class=\"bv-section__title\">who am i, anyway<\u002Fh2>\n      <p>Brandon blends curiosity with hands‑on engineering, diving into everything from AI models to Raspberry Pi robotics to cloud‑based software pipelines. He’s driven by the challenge of creating small systems that think, adapt, and automate — and he’s constantly exploring new ways to push the boundaries of what’s possible with accessible hardware and modern cloud platforms.<\u002Fp>\n      \n    <\u002Fdiv>\n    <div class=\"bv-about__term\">\n      <div class=\"bv-term__head\">\n        <span class=\"bv-term__dot\" style=\"background:#ff2d8a\"><\u002Fspan>\n        <span class=\"bv-term__dot\" style=\"background:#ffd23d\"><\u002Fspan>\n        <span class=\"bv-term__dot\" style=\"background:#3aff7a\"><\u002Fspan>\n        <span class=\"bv-term__title\">~/brandon — whoami<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"bv-term__body\">\n        <div><span class=\"d\">$<\u002Fspan> whoami --verbose<\u002Fdiv>\n        <div><span class=\"p\">name<\u002Fspan>: brandon vidaurre<\u002Fdiv>\n        <div><span class=\"p\">role<\u002Fspan>: Ai Cloud Engineer <\u002Fdiv>\n        <div><span class=\"p\">stack<\u002Fspan>: python, java, html<\u002Fdiv>\n        <div><span class=\"p\">tools<\u002Fspan>: aws, azure, claude code, vmware  <\u002Fdiv>\n\n        <div><span class=\"p\">status<\u002Fspan>: <span class=\"ok\">[ available ]<\u002Fspan><\u002Fdiv>\n        <div><span class=\"d\">$<\u002Fspan> <span class=\"cur\">_<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section class=\"bv-section bv-section--contact\" id=\"contact\">\n  <div class=\"bv-contact\">\n    <div class=\"bv-eyebrow\">TRANSMIT · EP_005<\u002Fdiv>\n    <h2 class=\"bv-section__title\">let's build something<\u002Fh2>\n    <p class=\"bv-contact__sub\">drop a line, an idea, im always open to possibilities<\u002Fp>\n    <div class=\"bv-contact__form\" id=\"contact-form\" style=\"flex-direction:column\">\n      <input id=\"contact-name\" class=\"bv-input\" placeholder=\"your name\" type=\"text\">\n      <input id=\"contact-email\" class=\"bv-input\" placeholder=\"you@anywhere.com\" type=\"email\">\n      <textarea id=\"contact-message\" class=\"bv-input\" placeholder=\"your message\" rows=\"4\" style=\"resize:vertical;min-height:100px\"><\u002Ftextarea>\n      <div id=\"contact-error\" style=\"display:none;color:#ff4444;font-size:0.7rem;margin-top:4px\">transmission failed. try again.<\u002Fdiv>\n      <button class=\"bv-btn bv-btn--primary\" onclick=\"submitContact()\">SEND &nbsp;→<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"bv-contact__sent\" id=\"contact-sent\" style=\"display:none\">\n      <span class=\"bv-dot\"><\u002Fspan>\n      TRANSMISSION RECEIVED. expect a reply within 24 earth-hours.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer class=\"bv-footer\">\n  <div class=\"bv-footer__row\">\n    <div class=\"bv-footer__brand\">BV · BRANDON VIDAURRE © 2026<\u002Fdiv>\n    <div class=\"bv-footer__links\">\n      <a href=\"https://github.com\" target=\"_blank\" rel=\"noopener\">github<\u002Fa>\n      <a href=\"https://www.linkedin.com/in/brandon-vidaurre-bb6384a5/\" target=\"_blank\" rel=\"noopener\">linkedin<\u002Fa>\n      <a href=\"#\">youtube<\u002Fa>\n     \n      <a href=\"#\">résumé.pdf<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"bv-footer__sig\">made with neon &amp; nostalgia · build #0142<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\nfunction startPlaying(){\n  var s=document.getElementById('tv-screen');\n  s.querySelector('.bv-tv__play').style.display='none';\n  var d=document.createElement('div');\n  d.className='bv-tv__playing';\n  d.innerHTML=\n    '<div class=\"bv-tv__bars\">'+\n    Array(8).fill(0).map((_,i)=>'<span style=\"animation-delay:'+i*0.15+'s\"><\u002Fspan>').join('')+\n    '<\u002Fdiv>'+\n    '<div class=\"bv-tv__caption\">[ NOW PLAYING — EP. 042 ]<\u002Fdiv>';\n  s.insertBefore(d,s.querySelector('.bv-tv__scan'));\n}\nfunction submitContact(){\n  var name=document.getElementById('contact-name').value.trim();\n  var email=document.getElementById('contact-email').value.trim();\n  var msg=document.getElementById('contact-message').value.trim();\n  var err=document.getElementById('contact-error');\n  if(!name||!email||!msg){err.style.display='block';return;}\n  err.style.display='none';\n  var btn=document.querySelector('#contact-form .bv-btn');\n  btn.disabled=true;btn.innerHTML='SENDING...';\n  emailjs.send('service_xxofsrd','template_9aypi36',{from_name:name,from_email:email,message:msg})\n    .then(function(){\n      document.getElementById('contact-form').style.display='none';\n      document.getElementById('contact-sent').style.display='flex';\n    })\n    .catch(function(){\n      err.textContent='transmission failed. try again.';\n      err.style.display='block';\n      btn.disabled=false;btn.innerHTML='SEND &nbsp;→';\n    });\n}\n\n// smooth scroll for nav\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(a=>{\n  a.addEventListener('click',e=>{\n    const id=a.getAttribute('href').slice(1);\n    const el=document.getElementById(id);\n    if(el){ e.preventDefault(); window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 60, behavior:'smooth'}); }\n  });\n});\n\n// active nav\nwindow.addEventListener('scroll',()=>{\n  const sections=['projects','vlog','about','contact'];\n  sections.forEach(id=>{\n    const el=document.getElementById(id);\n    const links=document.querySelectorAll('.bv-header__nav a');\n    if(!el) return;\n    const top=el.getBoundingClientRect().top;\n    links.forEach(l=>{\n      if(l.getAttribute('href')==='#'+id){\n        if(top<200&&top>-el.offsetHeight/2) l.classList.add('is-active');\n        else l.classList.remove('is-active');\n      }\n    });\n  });\n});\n<\u002Fscript>\n\n\n\n<script type=\"text/javascript\" src=\"https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js\"><\u002Fscript>\n<script>emailjs.init('DO_eRdO7GVL-qEgZ0');<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
